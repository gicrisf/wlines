name: Build
run-name: ${{ github.actor }} is testing out releases.
on: [push]
jobs:
  build:
    name: Ubuntu->Windows Cross Compile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt install gcc-mingw-w64-x86-64
    - name: Make
      run: make
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: | 
          wlines.exe
          wlines-daemon.exe 

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with: 
          name: binaries
      - name: Release
        uses: softprops/action-gh-release@v1
        with: 
         files: | 
            wlines.exe
            wlines-daemon.exe 


